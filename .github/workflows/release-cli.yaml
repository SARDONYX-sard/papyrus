name: Release(CLI)

on:
  push:
    tags:
      - "*"

env:
  APP_NAME: papyrus_analyzer
  CARGO_TERM_COLOR: always
  PROFILE: release-lto

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: aarch64-apple-darwin,
              os: macos-latest,
              asset: aarch64-apple-darwin.tar.gz,
            }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              asset: x86_64-pc-windows-msvc.zip,
            }
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              asset: x86_64-unknown-linux-gnu.tar.gz,
            }

    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Build and Compress
        uses: ./.github/actions/build-and-compress
        with:
          target: ${{ matrix.job.target }}
          profile: ${{ env.PROFILE }}
          app_name: ${{ env.APP_NAME }}
          asset_name: ${{ env.APP_NAME }}-${{ matrix.job.asset }}
          features: ${{ matrix.job.features }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The server binary was moved to ./build by the build action. The
      # extension needs its production dependencies, so they are packaged.
      - name: Package VSIX
        run: node dist.cjs --vsix --target ${{ matrix.job.target }} --binary ./build/${{ env.APP_NAME }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Attach VSIX to GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: "*.vsix"
          omitBody: true
