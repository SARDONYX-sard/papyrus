name: Build(CLI)

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

# Only the latest push job is executed when successive pushes are performed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: papyrus_analyzer
  CARGO_TERM_COLOR: always
  PROFILE: release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        job:
          # default features
          - {
              target: aarch64-apple-darwin,
              os: macos-latest,
              asset: aarch64-apple-darwin.tar.gz,
            }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-latest,
              asset: x86_64-pc-windows-msvc.zip,
            }
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              asset: x86_64-unknown-linux-gnu.tar.gz,
              # features: mimalloc
            }
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build and Compress
        uses: ./.github/actions/build-and-compress
        with:
          target: ${{ matrix.job.target }}
          profile: ${{ env.PROFILE }}
          app_name: ${{ env.APP_NAME }}
          asset_name: ${{ env.APP_NAME }}-${{ matrix.job.asset }}
          features: ${{ matrix.job.features }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same packaging as the release, see dist.js.
      - name: Package VSIX
        run: node dist.js --vsix --target ${{ matrix.job.target }} --binary ./build/${{ env.APP_NAME }}${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Upload VSIX
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.APP_NAME }}-vsix-${{ matrix.job.target }}
          path: "*.vsix"
