name: Build

# Builds, for each platform, the VSIX and an archive (zip on Windows, tar.gz
# elsewhere) of papyrus_analyzer: the server, `lint`, `fmt` and the other
# subcommands. Pushes to main and pull requests upload them as artifacts; tags
# build with `release-lto` and attach them to the GitHub release.
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

# Only the latest push job is executed when successive pushes are performed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: papyrus_analyzer
  CARGO_TERM_COLOR: always
  PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'release-lto' || 'release' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz, exe: "" }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip, exe: .exe }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz, exe: "" }
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: write
    env:
      EXE: papyrus_analyzer${{ matrix.job.exe }}
      ASSET: papyrus_analyzer-${{ matrix.job.target }}.${{ matrix.job.archive }}

    steps:
      - uses: actions/checkout@v7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: cargo-${{ env.PROFILE }}-${{ matrix.job.target }}

      - name: Build
        run: cargo build --profile ${{ env.PROFILE }} --target ${{ matrix.job.target }}

      - name: Install cargo-license
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-license,cargo-bundle-licenses

      # papyrus_analyzer and the licenses of its dependencies, in build/pkg.
      - name: Collect outputs
        shell: bash
        run: |
          mkdir -p build/pkg
          cp "target/${{ matrix.job.target }}/${{ env.PROFILE }}/$EXE" build/pkg/
          {
            echo '# SPDX-License-Identifier: Apache-2.0 OR MIT'
            echo '# SPDX-FileCopyrightText: (C) 2024 SARDONYX'
            echo ''
            echo '# Generated by `cargo license --color never`'
            echo 'third_party_licenses = """'
            cargo license --color never
            echo '"""'
            echo ''
            echo '# Generated by `cargo bundle-licenses -f toml`'
            cargo bundle-licenses -f toml 2>/dev/null
          } > build/pkg/LICENSES.toml

      # `zip` does not exist on Windows runners.
      - name: Compress (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/pkg/* -DestinationPath "build/$env:ASSET"

      - name: Compress (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar -czf "build/$ASSET" -C build/pkg .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: node build.cjs --vsix --target ${{ matrix.job.target }} --binary build/pkg/${{ env.EXE }}

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.job.target }}
          path: |
            build/*.vsix
            build/${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: build/*.vsix,build/${{ env.ASSET }}
          omitBody: true
