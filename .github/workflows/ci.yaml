name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read

# Only the latest push job is executed when successive pushes are performed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting does not depend on the platform.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  # Lint and test share the build of each platform.
  check:
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.job.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          prefix-key: cargo-debug-${{ matrix.job.target }}

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # https://nexte.st/docs/installation/pre-built-binaries/#using-nextest-in-github-actions
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace --no-fail-fast
